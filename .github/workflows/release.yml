name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match the version in main.py
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "version=\"${VERSION}\"" main.py || { echo "main.py does not contain version=\"${VERSION}\""; exit 1; }

      - name: Image name (GHCR needs lower case)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/labbank-account" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha
            type=semver,pattern={{version}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image"
            echo "- version tag: ${{ steps.name.outputs.image }}:${GITHUB_REF_NAME#v}"
            echo "- digest: ${{ steps.build.outputs.digest }}"
            echo ""
            echo "Line for versions.env of labbank-platform:"
            echo '```'
            echo "ACCOUNT_IMAGE=${{ steps.name.outputs.image }}:${GITHUB_REF_NAME#v}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"