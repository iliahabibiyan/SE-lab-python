services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - s1_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 15

  s1:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set in .env}
      SEED_DATA: ${SEED_DATA:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_ACCOUNTS_PER_USER: ${MAX_ACCOUNTS_PER_USER:-5}
      S2_BASE_URL: ${S2_BASE_URL:-}
    ports:
      - "${S1_PORT:-8081}:8081"
    healthcheck:
      # /ready checks the database too; the slim image has no curl, so Python makes the request
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

    frontend:
      build: ./frontend
      ports:
        - "${FRONTEND_PORT:-8080}:80"
      depends_on:
        s1:
          condition: service_healthy

volumes:
  s1_pgdata: