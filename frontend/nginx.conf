# Use the correlation id sent by the browser, or create one (GEN-08)
map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    ""      $request_id;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # the S1 service is reachable by its Compose service name
    location /api/ {
        proxy_pass http://s1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Correlation-ID $correlation_id;
    }
    location = /health {
        proxy_pass http://s1:8081;
    }
    location = /ready {
        proxy_pass http://s1:8081;
    }

    location / {
        try_files $uri /index.html;
    }
}