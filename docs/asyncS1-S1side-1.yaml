asyncapi: 3.0.0
info:
  title: LabBank S1 ↔ S3 — account-number authorization check — S1 PERSPECTIVE — PROPOSED
  version: 0.4.0
  description: Standalone AsyncAPI 3 contract, S1 perspective (mirror of the S3 file, S1 receives the command and sends the result). S3 sends source/destination account NUMBERS
    and a delegated authentication token in Kafka record headers. S1 returns canonical account IDs, account
    eligibility, source-account transfer limit and authoritative is_internal. No IBAN or operation-type discriminator
    is exchanged. This check contains no transfer amount and therefore does not authorize a specific amount
    or consume a daily limit. Revised v2 is a breaking, unapproved draft; retain these v2 topic addresses only
    if the previous v2 draft has not been deployed, otherwise negotiate new versioned topics. Kafka deployment,
    token delegation policy and limit semantics require agreement with S1.
defaultContentType: application/json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: Local-development example only. Production addresses and SASL/TLS policy require agreement.
channels:
  checkTransferAuthorization:
    address: lab.s3.s1.command.authorization.check.v2
    messages:
      CheckTransferAuthorization:
        $ref: '#/components/messages/CheckTransferAuthorization'
    description: 'Kafka record key = transaction_id. Consumer: S1. ACL permits S3 producer and target consumer
      only. Normative record-key convention: UTF-8 transaction_id string; receiver validates equality with
      payload.transaction_id. Ordering is per partition within this topic only, never across topics. ACL text
      is a deployment requirement, not provisioned configuration. Required Kafka record header authorization
      carries a delegated Bearer access token. There are exactly two fields in data: source_number and dest_number.'
  s1OperationResult:
    address: lab.s1.s3.event.operation-result.v2
    messages:
      S1OperationResult:
        $ref: '#/components/messages/S1OperationResult'
    description: 'S1 produces; S3 consumes. key=transaction_id. causation_id identifies the triggering command
      message. Normative record-key convention: UTF-8 transaction_id string; receiver validates equality with
      payload.transaction_id. Ordering is per partition within this topic only, never across topics. ACL text
      is a deployment requirement, not provisioned configuration. Results apply only to the account-number
      check. No token is echoed. is_internal is authoritative from S1.'
operations:
  receiveCheckTransferAuthorization:
    action: receive
    channel:
      $ref: '#/channels/checkTransferAuthorization'
    summary: S1 receives the account-number check from S3 and resolves the accounts
  sendS1Result:
    action: send
    channel:
      $ref: '#/channels/s1OperationResult'
    summary: S1 publishes the correlated result of the account-number check to S3
components:
  messages:
    CheckTransferAuthorization:
      name: CheckTransferAuthorization
      title: CheckTransferAuthorization command (proposed)
      contentType: application/json
      correlationId:
        location: $message.payload#/correlation_id
      payload:
        $ref: '#/components/schemas/CheckTransferAuthorization'
      headers:
        $ref: '#/components/schemas/AuthorizationHeaders'
      examples:
      - name: AccountNumbersOnly
        summary: Two account numbers and an illustrative, unusable token header.
        headers:
          authorization: Bearer EXAMPLE_ONLY_NOT_A_REAL_TOKEN
        payload:
          message_id: fdd06cc7-6382-4502-a65b-fab947ddbd55
          schema_version: '2.0'
          transaction_id: 54e8c94a-f952-4e24-8541-55f93b889ed9
          correlation_id: 431a21a4-e187-472a-857f-086540fcb780
          occurred_at: '2026-11-01T08:00:00Z'
          producer: S3-PAY
          message_type: CheckTransferAuthorization.v2
          operation_id: df1f3925-f166-4e8b-8635-b6148198a23c
          data:
            source_number: 001200456789
            dest_number: 001200987654
    S1OperationResult:
      name: S1OperationResult
      contentType: application/json
      correlationId:
        location: $message.payload#/correlation_id
      payload:
        $ref: '#/components/schemas/S1OperationResult'
      examples:
      - name: InternalAccounts
        payload:
          message_id: 4cb77b20-f9a7-4b41-a909-f25571380c33
          schema_version: '2.0'
          transaction_id: 54e8c94a-f952-4e24-8541-55f93b889ed9
          correlation_id: 431a21a4-e187-472a-857f-086540fcb780
          causation_id: fdd06cc7-6382-4502-a65b-fab947ddbd55
          occurred_at: '2026-11-01T08:00:00Z'
          producer: S1-ACC
          message_type: S1OperationResult.v2
          operation_id: df1f3925-f166-4e8b-8635-b6148198a23c
          outcome: APPLIED
          data:
            src_account_id: 515a888a-c8e9-4750-9621-273849409a44
            dest_account_id: 7e9a62d2-77b3-4bf8-a19c-de2c51effcab
            src_allowed: true
            dest_allowed: true
            is_internal: true
            account_limit:
              amount: 500000000
              currency: IRR
      - name: ExternalDestination
        payload:
          message_id: 9acb0824-7d43-4437-8aed-eb6b4e621001
          schema_version: '2.0'
          transaction_id: 54e8c94a-f952-4e24-8541-55f93b889ed9
          correlation_id: 431a21a4-e187-472a-857f-086540fcb780
          causation_id: fdd06cc7-6382-4502-a65b-fab947ddbd55
          occurred_at: '2026-11-01T08:00:00Z'
          producer: S1-ACC
          message_type: S1OperationResult.v2
          operation_id: df1f3925-f166-4e8b-8635-b6148198a23c
          outcome: APPLIED
          data:
            src_account_id: 515a888a-c8e9-4750-9621-273849409a44
            dest_account_id: null
            src_allowed: true
            dest_allowed: true
            is_internal: false
            account_limit:
              amount: 500000000
              currency: IRR
      - name: InvalidToken
        payload:
          message_id: 327f7dd0-a6cd-4821-b5bf-d61ef261c0cf
          schema_version: '2.0'
          transaction_id: 54e8c94a-f952-4e24-8541-55f93b889ed9
          correlation_id: 431a21a4-e187-472a-857f-086540fcb780
          causation_id: fdd06cc7-6382-4502-a65b-fab947ddbd55
          occurred_at: '2026-11-01T08:00:00Z'
          producer: S1-ACC
          message_type: S1OperationResult.v2
          operation_id: df1f3925-f166-4e8b-8635-b6148198a23c
          outcome: REJECTED
          error:
            code: UNAUTHORIZED
            retryable: false
            public_message: Authentication token is invalid or expired.
            problem:
              type: https://errors.labbank.example/unauthorized
              title: Unauthorized
              status: 401
              code: UNAUTHORIZED
              detail: A valid S1-audience delegated token is required.
              correlation_id: 431a21a4-e187-472a-857f-086540fcb780
      - name: SourceNotFound
        payload:
          message_id: 5d1f0c3e-2b7a-4c65-9e0a-1f6b8a7d3c21
          schema_version: '2.0'
          transaction_id: 54e8c94a-f952-4e24-8541-55f93b889ed9
          correlation_id: 431a21a4-e187-472a-857f-086540fcb780
          causation_id: fdd06cc7-6382-4502-a65b-fab947ddbd55
          occurred_at: '2026-11-01T08:00:00Z'
          producer: S1-ACC
          message_type: S1OperationResult.v2
          operation_id: df1f3925-f166-4e8b-8635-b6148198a23c
          outcome: REJECTED
          error:
            code: NOT_FOUND
            retryable: false
            public_message: Source account was not found.
            problem:
              type: https://errors.labbank.example/not-found
              title: Not Found
              status: 404
              code: NOT_FOUND
              detail: Source account number does not match any internal S1 account.
              correlation_id: 431a21a4-e187-472a-857f-086540fcb780
  schemas:
    CheckTransferAuthorization:
      type: object
      additionalProperties: false
      properties:
        message_id:
          type: string
          format: uuid
          description: UUID for this message. Broker redelivery/outbox replay of the same stored message preserves
            it. A newly constructed retry message may use a new message_id while preserving operation_id.
        schema_version:
          type: string
          const: '2.0'
        transaction_id:
          type: string
          format: uuid
        correlation_id:
          type: string
          format: uuid
        causation_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
          description: Message creation time at producer, expressed in UTC with Z; not processing time or an
            ordering guarantee.
          pattern: Z$
        producer:
          type: string
          minLength: 1
          const: S3-PAY
        message_type:
          type: string
          const: CheckTransferAuthorization.v2
        operation_id:
          type: string
          format: uuid
          description: S3-assigned UUID for one logical lookup. Retry preserves it; a fresh intentional check
            uses a fresh ID to obtain current account/limit state. This is an identity, not an operation-type
            field. Authenticate the delegated principal before deduplication.
        data:
          type: object
          additionalProperties: false
          properties:
            source_number:
              type: string
              pattern: ^[0-9]+$
              minLength: 1
              description: Account NUMBER supplied by caller; not an account ID or IBAN. Decimal string preserving
                leading zeroes. Length and routing rules are defined by S1.
            dest_number:
              type: string
              pattern: ^[0-9]+$
              minLength: 1
              description: Account NUMBER supplied by caller; not an account ID or IBAN. Decimal string preserving
                leading zeroes. Length and routing rules are defined by S1.
          required:
          - source_number
          - dest_number
      required:
      - message_id
      - schema_version
      - transaction_id
      - correlation_id
      - occurred_at
      - producer
      - message_type
      - operation_id
      - data
      description: Account/permission lookup, not amount authorization. Only the two account numbers are business
        inputs; authentication is in Kafka record headers. S1 owns destination classification. S3 must not
        infer the bank or IBAN from these numbers.
    OperationError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        retryable:
          type: boolean
        public_message:
          type: string
          minLength: 1
          description: Safe human-readable explanation, never the token or sensitive token claims.
        problem:
          $ref: '#/components/schemas/Problem'
      required:
      - code
      - retryable
      - public_message
      - problem
      description: Application command-processing error, not a Kafka broker status. code supports base project
        codes and service extensions. Broker ACL/auth/size failures can prevent delivery and may produce no
        result message.
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          minLength: 1
          description: 'Stable machine-readable code. Base examples: VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN,
            NOT_FOUND, CONFLICT, IDEMPOTENCY_KEY_REUSED, SERVICE_UNAVAILABLE, UPSTREAM_TIMEOUT. Service-specific
            codes are permitted.'
        detail:
          type: string
        correlation_id:
          type: string
          format: uuid
      required:
      - code
      - correlation_id
      - detail
      - status
      - title
      - type
      description: Problem Details-shaped application error. status is an HTTP-equivalent classification for
        interoperability; Kafka itself sends no HTTP response/status. correlation_id and code must equal the
        enclosing result/error values.
    S1OperationResult:
      type: object
      additionalProperties: false
      properties:
        message_id:
          type: string
          format: uuid
          description: UUID for this message. Broker redelivery/outbox replay of the same stored message preserves
            it. A newly constructed retry message may use a new message_id while preserving operation_id.
        schema_version:
          type: string
          const: '2.0'
        transaction_id:
          type: string
          format: uuid
        correlation_id:
          type: string
          format: uuid
        causation_id:
          type: string
          format: uuid
          description: message_id of the command that triggered this result. operation_id remains the identity
            of the logical operation across retries.
        occurred_at:
          type: string
          format: date-time
          description: Message creation time at producer, expressed in UTC with Z; not processing time or an
            ordering guarantee.
          pattern: Z$
        producer:
          type: string
          minLength: 1
          const: S1-ACC
        message_type:
          type: string
          const: S1OperationResult.v2
        operation_id:
          type: string
          format: uuid
          description: S3-assigned UUID identifying one logical command. Stable across retries; echoed unchanged
            in results. Receiver must deduplicate by authenticated producer + operation_id and reject reuse
            with a different command type or semantic payload. See README.
        outcome:
          type: string
          enum:
          - APPLIED
          - REJECTED
          - UNKNOWN
          - PENDING
          description: Outcome of this account lookup only, never final payment success. APPLIED means the
            check completed; S3 must still inspect src_allowed/dest_allowed and evaluate the transfer amount
            against the agreed limit policy. REJECTED is a failed check. UNKNOWN/PENDING are not permission
            to transfer.
        data:
          $ref: '#/components/schemas/AuthorizationCheckData'
        error:
          $ref: '#/components/schemas/OperationError'
      required:
      - message_id
      - schema_version
      - transaction_id
      - correlation_id
      - causation_id
      - occurred_at
      - producer
      - message_type
      - operation_id
      - outcome
      allOf:
      - if:
          properties:
            outcome:
              const: APPLIED
          required:
          - outcome
        then:
          required:
          - data
          not:
            required:
            - error
      - if:
          properties:
            outcome:
              enum:
              - REJECTED
              - UNKNOWN
          required:
          - outcome
        then:
          required:
          - error
          not:
            required:
            - data
      - if:
          properties:
            outcome:
              const: PENDING
          required:
          - outcome
        then:
          not:
            anyOf:
            - required:
              - data
            - required:
              - error
      description: For APPLIED, every business response field is required, including account_limit.amount/currency.
        An external destination still has a required dest_account_id key with null value. On failed/unknown
        checks, error replaces successful data; do not fill missing account IDs or limits with fake values.
        No IBAN, operation_type or op_type is accepted.
    AuthorizationHeaders:
      type: object
      additionalProperties: false
      properties:
        authorization:
          type: string
          pattern: ^Bearer [A-Za-z0-9._~+/=-]+$
          minLength: 8
          description: Required Kafka record header, exactly lowercase authorization; UTF-8 bytes with value
            Bearer <delegated access token>. Use a short-lived token intended for S1, preferably token-exchanged
            for this audience. The example is not a usable credential. Validate signature/issuer/audience/expiry/scopes
            and account ownership at processing time; never log the value. This header is persisted by Kafka
            and is NOT an HTTP header or a replacement for broker SASL/TLS/ACL.
      required:
      - authorization
    MoneyLimit:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
          description: Source-account configured transfer ceiling, in integer rials. Zero is a real zero ceiling,
            not unlimited. Not remaining daily allowance and not a funds balance. Whether this is a per-transfer
            or daily policy must be agreed with S1 before implementation. Consumers must use a lossless int64
            representation.
        currency:
          type: string
          const: IRR
      required:
      - amount
      - currency
      description: Source-account ceiling returned by S1. No amount is sent in the check command, so this result
        is not an amount-specific approval or an atomic limit reservation.
    AuthorizationCheckData:
      type: object
      additionalProperties: false
      properties:
        src_account_id:
          type: string
          format: uuid
          description: Canonical account ID issued by S1, NOT the source account number. UUID per project GEN-04.
        dest_account_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Canonical S1 account ID for an internal destination; null for an external destination
            without a local S1 account. Key is always required. Never fabricate an ID or reuse the account
            number.
        src_allowed:
          type: boolean
          description: Source-account-level ownership/status/withdrawal permission for the delegated principal.
            Does not compare a transfer amount against limits or funds.
        dest_allowed:
          type: boolean
          description: Destination eligibility according to S1 routing/account policy. For an external destination,
            this is not proof of a remote account balance or remote-bank authorization.
        is_internal:
          type: boolean
          description: Authoritative routing classification supplied by S1. S3 must not derive another internal/external
            flag or request transfer_type.
        account_limit:
          $ref: '#/components/schemas/MoneyLimit'
      required:
      - src_account_id
      - dest_account_id
      - src_allowed
      - dest_allowed
      - is_internal
      - account_limit
      allOf:
      - if:
          properties:
            is_internal:
              const: true
          required:
          - is_internal
        then:
          properties:
            dest_account_id:
              type: string
              format: uuid
        else:
          properties:
            dest_account_id:
              type: 'null'
x-contract-rules:
  processing-order: 'S1 processes each command in this fixed order. (1) Look up source_number among internal S1 accounts; if it does not exist, reply REJECTED with NOT_FOUND and stop. (2) Validate the delegated token from the authorization header; if missing, invalid or expired, reply REJECTED with UNAUTHORIZED and stop. (3) Look up dest_number; an internal account gives is_internal true and its dest_account_id, otherwise is_internal false and dest_account_id null (an unknown destination is not an error, it is external). (4) Reply APPLIED with src_account_id, dest_account_id, src_allowed, dest_allowed, is_internal and the source account_limit.'
  perspective: All action values are from S1 perspective. Topic addresses and schemas are identical to the S3 file, with send/receive reversed. Kafka does not offer an HTTP-style response; S1 publishes the correlated result
    on the result topic.
  routing: S1 returns is_internal. Do not synthesize IBANs or infer routing from account-number suffixes/prefixes.
    Account numbers are inputs; canonical UUID account IDs are outputs. For an external account without a local
    S1 record, dest_account_id is required and null.
  limit-policy: account_limit is the source-account configured ceiling in IRR. It is not available funds or
    a remaining daily allowance. Exact policy scope must be agreed with S1; no fabricated default or unlimited
    sentinel. S3 evaluates amount against the agreed policy and requests funds checks from the ledger service.
    This read-only lookup cannot atomically enforce concurrent daily spend or consume a limit.
  authentication: authorization is a lowercase Kafka record header encoded in UTF-8, not part of data. S1 validates
    the delegated token and account permissions before processing or returning a cached result. Expired/invalid
    tokens cause UNAUTHORIZED; authenticated but forbidden access causes FORBIDDEN. Authenticate producer identity
    separately through broker SASL/TLS and ACL; do not trust payload.producer alone.
  credential-handling: Kafka headers are persisted and exposed to authorized topic readers and possibly DLQ/observability
    tooling. Use audience-restricted short-lived delegated tokens; restrict topic readers/retention/replay
    and use TLS/encryption at rest. Redact tokens from logs, traces, error messages and examples; never echo
    them in results. Token forwarding through Kafka requires S1/security approval.
  idempotency: HTTP client Idempotency-Key remains independent. A retry of one logical lookup preserves operation_id
    and semantic data; a fresh check uses a new operation_id. Bind dedup to authenticated producer, delegated
    principal and operation_id; reject incompatible principal/data reuse. A refreshed token for the same principal
    is not a changed business payload, but current authentication must still pass before cached data is returned.
  message-identity: Broker redelivery preserves message_id. A newly constructed retry can have a new message_id
    while preserving operation_id. Result echoes transaction_id/correlation_id/operation_id; causation_id is
    the triggering command message_id. UTC occurred_at ends with Z. Record key equals transaction_id.
  result-validation: APPLIED requires all AuthorizationCheckData properties. REJECTED/UNKNOWN require every
    OperationError property and omit data. PENDING omits data/error. S3 must never transfer on a pending/unknown
    result or merely because a check was APPLIED. Error.code must equal error.problem.code, and problem.correlation_id
    must equal the envelope correlation_id.
  transport: Kafka support remains proposed and needs provider/technical approval. Broker authentication/ACL/message-size
    failures can prevent delivery and may produce no application result. This file does not provision broker
    configuration.
  compatibility: 'Breaking revision of an unpublished v2 draft: account IDs are UUIDs rather than account-number
    strings; amount/type/currency inputs and IBAN/type outputs are removed, auth header and limit are required.
    The two retained topic addresses are unchanged by request. Never hot-swap this into a deployed v2 fleet;
    coordinate a new major wire version if v2 is already live.'
