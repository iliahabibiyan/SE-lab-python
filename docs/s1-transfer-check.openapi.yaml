openapi: 3.1.0
info:
  title: S1 (Customer & Account) - Transfer account check
  version: 1.0.0
  description: |
    **Provider:** S1 (ACC1-S, port 8081). **Consumer:** S3 (Payment Orchestration).

    Before moving money, S3 sends the source and destination account numbers (IBAN / Sheba) and the
    customer's access token. S1 answers whether the accounts exist and may be used.

    Order of the checks (important):
    1. Source account does not exist -> `404 NOT_FOUND`, nothing else is checked.
    2. Token is not valid for the source account -> `401 UNAUTHORIZED`.
    3. Destination account does not exist -> `200`, `destination.found = false`; the source info is still returned.
    4. Destination exists -> `200`, `destination.found = true` with the destination status and id.

    `active` is `true` only when the account status is ACTIVE and its owner is ACTIVE.
    The source `limit` is the transfer limit of the source account (GEN-03 money object, IRR).

    Assumptions to confirm with S3: account numbers are Sheba (`IR` + 24 digits); the token is the customer
    access token issued by S1 login, and "valid" means: signature and expiry are fine AND its user owns the source account.
servers:
  - url: http://localhost:8081
    description: S1 on a developer machine
tags:
  - name: transfer-check
    description: Pre-check of the accounts of a transfer
paths:
  /api/v1/accounts/transfer-check:
    post:
      tags: [transfer-check]
      operationId: checkTransferAccounts
      summary: Check the source and destination account of a transfer
      description: Read-only check (nothing is changed in S1), so no Idempotency-Key is needed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferCheckRequest'
            example:
              source_sheba: IR120990000000000000000001
              destination_sheba: IR330990000000000000000002
      responses:
        '200':
          description: Source exists and the token is valid. The destination may or may not exist (see `destination.found`).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferCheckResult'
              examples:
                destinationFound:
                  summary: Both accounts exist
                  value:
                    source:
                      account_id: 0192a7e4-6b1d-7c3e-9a41-2f5d8e0b7c11
                      active: true
                      limit:
                        amount: 50000000
                        currency: IRR
                    destination:
                      found: true
                      account_id: 0192a7e5-1c2d-7a90-8b33-4d6e9f0a1b22
                      active: true
                destinationNotFound:
                  summary: Destination is not a LabBank account
                  value:
                    source:
                      account_id: 0192a7e4-6b1d-7c3e-9a41-2f5d8e0b7c11
                      active: true
                      limit:
                        amount: 50000000
                        currency: IRR
                    destination:
                      found: false
                      account_id: null
                      active: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '404':
          $ref: '#/components/responses/SourceNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token of the customer (issued by `POST /api/v1/auth/login`). It is read only after the
        source account was found (see the order of the checks).
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Created by S1 when missing; pass it to every following call (GEN-08).
      schema:
        type: string
  headers:
    CorrelationId:
      description: The correlation id of this request.
      schema:
        type: string
  schemas:
    TransferCheckRequest:
      type: object
      required: [source_sheba, destination_sheba]
      additionalProperties: false
      properties:
        source_sheba:
          $ref: '#/components/schemas/Sheba'
        destination_sheba:
          $ref: '#/components/schemas/Sheba'
    Sheba:
      type: string
      pattern: '^IR[0-9]{24}$'
      description: IBAN in the Iranian format. Digits 5 to 7 are the bank code; LabBank is `099`.
      examples:
        - IR120990000000000000000001
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 0
          description: Amount in Rial. Never a float (GEN-03).
        currency:
          type: string
          enum: [IRR]
    SourceAccount:
      type: object
      required: [account_id, active, limit]
      properties:
        account_id:
          type: string
          format: uuid
        active:
          type: boolean
          description: true if the account may send money.
        limit:
          $ref: '#/components/schemas/Money'
    DestinationAccount:
      type: object
      required: [found, account_id, active]
      properties:
        found:
          type: boolean
          description: false when the destination is not an account of LabBank.
        account_id:
          type: [string, 'null']
          format: uuid
          description: null when `found` is false.
        active:
          type: [boolean, 'null']
          description: true if the account may receive money; null when `found` is false.
    TransferCheckResult:
      type: object
      required: [source, destination]
      properties:
        source:
          $ref: '#/components/schemas/SourceAccount'
        destination:
          $ref: '#/components/schemas/DestinationAccount'
    Problem:
      type: object
      description: RFC 9457 problem details (GEN-06).
      required: [type, title, status, code, detail]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        correlation_id:
          type: [string, 'null']
        errors:
          type: array
          description: Only for VALIDATION_ERROR.
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
  responses:
    ValidationError:
      description: Missing field or malformed Sheba.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.labbank.example/validation-error
            title: Validation error
            status: 400
            code: VALIDATION_ERROR
            detail: Invalid or incomplete input
            correlation_id: 0192a7e5-3b0d-7c55-9a51-0c7e2b1d8f40
            errors:
              - field: source_sheba
                message: String should match pattern '^IR[0-9]{24}$'
    InvalidToken:
      description: The source account exists, but the token is missing, expired, forged or belongs to another user.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.labbank.example/unauthorized
            title: Unauthorized
            status: 401
            code: UNAUTHORIZED
            detail: Token is not valid for the source account
            correlation_id: 0192a7e5-3b0d-7c55-9a51-0c7e2b1d8f40
    SourceNotFound:
      description: No account with the source Sheba exists. Nothing else is checked.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.labbank.example/not-found
            title: Not found
            status: 404
            code: NOT_FOUND
            detail: Source account not found
            correlation_id: 0192a7e5-3b0d-7c55-9a51-0c7e2b1d8f40
    ServiceUnavailable:
      description: S1 can not answer now (for example its database is down).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://errors.labbank.example/service-unavailable
            title: Service unavailable
            status: 503
            code: SERVICE_UNAVAILABLE
            detail: Database is not reachable
            correlation_id: 0192a7e5-3b0d-7c55-9a51-0c7e2b1d8f40
